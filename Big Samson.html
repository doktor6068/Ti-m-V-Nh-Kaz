<meta name="theme-color" content="#F279A6">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{--clay:#C37966;--mint:#59D9CC;--pink:#F279A6;--ink:#3b2420;--cream:#FFF7F1}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.65 "Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background-color:var(--cream)}

h1,h2,h3{font-family:"Baloo 2","Trebuchet MS",sans-serif;line-height:1.1;margin:0 0 .4em}
	h1{font-size:clamp(2.6rem,8vw,4.6rem);font-weight:800} 
	h2{font-size:2rem} 
	h3{font-size:1.3rem}
	a{color:var(--ink)}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px}

/* Thanh menu: trong suốt trên ảnh, đổi thành nền khi cuộn */
nav{position:fixed;top:0;left:0;right:0;z-index:10;transition:background .3s,box-shadow .3s}
nav .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;padding-top:12px;padding-bottom:12px}
nav a{color:#fff;text-decoration:none;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.45)}
nav .logo{font:800 1.6rem "Baloo 2",sans-serif;margin-right:auto}
nav.solid{background:rgba(255,247,241,.94);backdrop-filter:blur(8px);box-shadow:0 3px 0 var(--mint)}
nav.solid a{color:var(--ink);text-shadow:none}
nav a.on{border-bottom:3px solid var(--pink)}

.hero{min-height:82vh;display:flex;align-items:flex-end;color:#fff;background-size:cover;background-position:center;position:relative}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(59,36,32,.35),rgba(59,36,32,.65))}
.hero .wrap{position:relative;width:100%;padding-bottom:64px;padding-top:120px}
.hero h1{text-shadow:0 2px 12px rgba(0,0,0,.4);animation:up .8s both;margin-bottom:0}
.hero p{max-width:34em;font-size:1.15rem;animation:up .8s .15s both}
.bar{height:10px;width:min(560px,80%);background:var(--pink);margin:4px 0 10px;border-radius:5px;animation:up .8s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}.ld-ring{animation:spin .9s linear infinite!important}}
.pagehead{padding:110px 0 30px;background:linear-gradient(120deg,var(--clay),var(--pink));color:#fff}
.pagehead h1{font-size:clamp(2rem,6vw,3rem);margin:0;text-shadow:0 2px 10px rgba(0,0,0,.3)}

section{padding:36px 0}
.btn{display:inline-block;background:var(--pink);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:9px 22px;font:600 1rem "Be Vietnam Pro",sans-serif;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0;box-shadow:3px 3px 0 var(--ink)}
.btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn.mint{background:var(--mint)} .btn.small{padding:3px 14px;font-size:.9rem;box-shadow:2px 2px 0 var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:5px 5px 0 var(--mint)}
.grid .card:nth-child(even){box-shadow:5px 5px 0 var(--pink)}
.card.cat{padding:0;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;margin:0}
.cat .pic{height:150px;background:var(--clay) center/cover;display:flex;align-items:center;justify-content:center;font-size:3rem}
.cat .txt{padding:12px 16px 16px;display:flex;flex-direction:column;align-items:flex-start;flex:1}
.cat .txt h3{margin-bottom:4px;max-width:100%;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .muted{margin-bottom:12px;max-width:100%;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .tag{margin-top:auto}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.muted{color:#7a5a52;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:2px solid var(--ink);border-radius:999px;padding:2px 14px;background:#fff;cursor:pointer;font:inherit;color:var(--ink)}
.chip.on{background:var(--mint)}
.price{font:800 1.4rem "Baloo 2",sans-serif;color:var(--clay)}
.tag{display:inline-block;background:var(--mint);border:2px solid var(--ink);border-radius:8px;padding:0 10px;font-weight:600}
label{display:block;margin:14px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:2px solid var(--ink);border-radius:10px;background:#fff;font:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.notice{background:#fff0d6;border:2px dashed var(--clay);border-radius:12px;padding:12px 16px;margin:12px 0}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.gallery img{width:100%;height:170px;object-fit:cover;border:2px solid var(--ink);border-radius:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:2px solid var(--ink);padding:8px;text-align:left;vertical-align:top;font-size:.92rem}
/* Form đặt vẽ: ô mô tả cố định kích thước, ô upload ảnh */
.card.form{max-width:820px;margin:0 auto}
textarea{resize:none;height:150px;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere}
input.sr{position:absolute;width:1px;height:1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0)}
.drop{display:block;margin:0;padding:18px 14px;text-align:center;border:2px dashed var(--clay);border-radius:12px;background:#fff9f4;cursor:pointer;font-weight:600}
.drop:hover,.drop.over,.drop:focus-within{background:#e8fbf8;border-color:var(--ink)}
.drop small{display:block;font-weight:400;color:#7a5a52}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:10px}
.thumbs:empty{display:none}
.thumb{position:relative}
.thumb img{display:block;width:100%;height:96px;object-fit:cover;border:2px solid var(--ink);border-radius:10px}
.thumb button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:var(--pink);color:var(--ink);font:700 14px/1 sans-serif;cursor:pointer;padding:0}

/* Màn hình loading */
.loader{position:fixed;inset:0;z-index:100;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff;
  opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s linear .28s}
.loader.on{opacity:1;visibility:visible;transition:opacity var(--fade-in,.18s) ease,visibility 0s}
.loader::before{content:"";position:absolute;inset:-220px;
  background:repeating-linear-gradient(135deg,#fff 0 40px,var(--mint) 40px 80px,var(--pink) 80px 120px);animation:slide 3s linear infinite}
@keyframes slide{to{transform:translate(84.85px,84.85px)}}
.ld-box{position:relative;width:190px;height:190px;border-radius:50%;background:var(--cream);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);display:grid;place-items:center}
.ld-ring{position:absolute;inset:8px;border-radius:50%;border:8px solid #ecdcd4;border-top-color:var(--pink);border-right-color:var(--mint);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-pic{position:relative;width:124px;height:124px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:3.4rem}
.ld-pic img{width:100%;height:100%;object-fit:contain}
footer{border-top:3px solid var(--mint);background:#fff;padding:22px 0;color:#7a5a52;font-size:.92rem}
</style>
</head>
<body>

<div class="loader on" id="loader" role="status" aria-label="Đang tải">

<noscript><style>.loader{display:none}</style></noscript>

/* ---------- Firebase (đăng nhập + lưu đơn) ---------- */
let fb = null, user = null;
const loadScript = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
async function initFirebase() {
  if (!FIREBASE.apiKey) return;
  try {
    const b = "https://www.gstatic.com/firebasejs/10.12.2/";
    await loadScript(b + "firebase-app-compat.js"); await loadScript(b + "firebase-auth-compat.js"); await loadScript(b + "firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE);
    fb = { auth: firebase.auth(), db: firebase.firestore() };
    fb.auth.onAuthStateChanged(u => { user = u; $("authLink").textContent = u ? "Tài khoản" : "Đăng nhập"; route(true); });
  } catch (e) { console.error(e); }
}
async function notify(o) {
  if (!NOTIFY_URL) return;
  try { await fetch(NOTIFY_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(o) }); } catch (e) {}
}
const isOwner = () => user && user.email === OWNER_EMAIL;

/* ---------- Các trang ---------- */
const docRow = d => `<div class="card row"><div><strong>${esc(d.title)}</strong><div class="muted">${esc(d.subject)} · ${esc(d.year)}</div></div>
  <a class="btn small mint" href="${esc(d.link)}" target="_blank" rel="noopener">Tải về</a></div>`;
// Thanh tiêu đề các trang con (Tài liệu, Bảng giá, Đặt vẽ...) dùng chung ảnh với trang chủ (HERO.image). HERO.image để "" thì dùng gradient.
const head = t => `<div class="pagehead" style="${HERO.image ? `background-image:linear-gradient(180deg,rgba(59,36,32,.35),rgba(59,36,32,.65)),${img(HERO.image)};background-size:cover;background-position:center` : ""}"><div class="wrap"><h1>${esc(t)}</h1></div></div>`;
const app = $("app");

    <div class="wrap"><h1>${esc(HERO.title)}</h1><div class="bar"></div><p>${esc(HERO.tagline)}</p>
    <a class="btn" href="#/dat-don">Đặt vẽ ngay</a><a class="btn mint" href="#/tai-lieu">Xem tài liệu</a></div></div>
  <div class="wrap">
    <section><h2>Tài liệu</h2><div class="grid">${CATEGORIES.map(c => {
      const n = DOCS.filter(d => d.subject === c.name).length;
      return `<a class="card cat" href="#/tai-lieu/${encodeURIComponent(c.name)}"><div class="pic" style="background-image:${[c.image, c.art].filter(Boolean).map(img).join(",")}">${c.image || c.art ? "" : c.emoji}</div>
      <div class="txt"><h3 title="${esc(c.name)}">${esc(c.name)}</h3><div class="muted" title="${esc(c.desc)}">${esc(c.desc)}</div><span class="tag">${n} tài liệu</span></div></a>`; }).join("")}</div></section>
    <section><h2>Nhận vẽ theo đơn</h2><div class="card row"><div><strong>Vẽ tay từ <span class="price">20.000đ</span></strong>
      <div class="muted">Đáp án hướng dẫn tự vẽ từ 10.000đ</div></div><a class="btn" href="#/bang-gia">Xem bảng giá</a></div></section>
  </div>`;
}

function docsPage(subject) {
  const subjects = [...new Set(DOCS.map(d => d.subject))];
  app.innerHTML = head("Tài liệu") + `<div class="wrap"><section>
    <input id="q" placeholder="Tìm theo tên tài liệu" aria-label="Tìm tài liệu">
    <div class="chips" id="chips"></div><div id="list"></div></section></div>`;
  let cur = subject || "";
  const draw = () => {
    $("chips").innerHTML = ["", ...subjects].map(s => `<button class="chip ${s === cur ? "on" : ""}" data-s="${esc(s)}">${esc(s || "Tất cả")}</button>`).join("");
    const q = $("q").value.trim().toLowerCase();
    const l = DOCS.filter(d => d.title.toLowerCase().includes(q) && (!cur || d.subject === cur));
    $("list").innerHTML = l.length ? l.map(docRow).join("") : `<p class="muted">Không tìm thấy tài liệu. Thử bỏ bộ lọc hoặc đổi từ khoá.</p>`;
    document.querySelectorAll(".chip").forEach(b => b.onclick = () => { cur = b.dataset.s; draw(); });
  };
  $("q").oninput = draw; draw();
}

function pricePage() {
  app.innerHTML = head("Bảng giá") + `<div class="wrap"><section>${PRICES.map(g => `<h2>${esc(g.group)}</h2><div class="grid">${g.items.map(i =>
    `<div class="card"><h3>${esc(i.name)}</h3><div class="price">${esc(i.price)}</div><div class="muted">${esc(i.note)}</div></div>`).join("")}</div>`).join("<br>")}
    <div class="notice">Giá chỉ để tham khảo, có thể thương lượng tuỳ độ khó và thời hạn.</div>
    ${SAMPLES.length ? `<h2>Bài vẽ mẫu</h2><div class="gallery">${SAMPLES.map(s => `<img loading="lazy" src="${esc(s)}" alt="Bài vẽ mẫu">`).join("")}</div>` : ""}
    <p><a class="btn" href="#/dat-don">Đặt vẽ ngay</a></p></section></div>`;
}

/* Ảnh đề bài đính kèm: nén về tối đa 1600px để gửi nhẹ */
const MAX_IMG = 5;
let orderFiles = [];   // { name, data: dataURL jpeg }
const fileToJpeg = file => new Promise((ok, no) => {
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", .82));
  };
  im.onerror = () => { URL.revokeObjectURL(url); no(new Error(file.name)); };
  im.src = url;
});

function orderPage() {
  app.innerHTML = head("Đặt vẽ kỹ thuật") + `<div class="wrap"><section><div class="card form">
    ${user ? `<p class="muted">Đang đăng nhập: ${esc(user.email)}. Đơn sẽ lưu vào tài khoản để bạn theo dõi.</p>`
           : `<p class="notice">Bạn chưa đăng nhập. Vẫn đặt được, nhưng đăng nhập thì sẽ theo dõi được trạng thái đơn. <a href="#/tai-khoan">Đăng nhập</a></p>`}
    <label for="f_name">Tên của bạn *</label><input id="f_name" value="${esc(user?.displayName || "")}">
    <label for="f_contact">Zalo / SĐT *</label><input id="f_contact">
    <label for="f_kind">Loại bài</label><select id="f_kind">${KINDS.map(k => `<option>${esc(k)}</option>`).join("")}</select>
    <label for="f_deadline">Hạn cần nhận</label><input id="f_deadline" type="date">
    <label for="f_budget">Ngân sách dự kiến</label><input id="f_budget" placeholder="VD: 100.000đ">
    <label for="f_note">Mô tả đề bài</label><textarea id="f_note" maxlength="1500" placeholder="Môn học, số bản vẽ, khổ giấy, yêu cầu riêng..."></textarea>
    <label for="f_files">Ảnh đề bài đính kèm</label>
    <label class="drop" id="drop" for="f_files">📎 Bấm để chọn ảnh hoặc kéo thả vào đây<small>Tối đa ${MAX_IMG} ảnh (JPG, PNG, WEBP)</small></label>
    <input class="sr" id="f_files" type="file" accept="image/*" multiple>
    <div class="thumbs" id="thumbs"></div>
    <p><button class="btn" id="submit">Gửi đơn</button></p><div id="done"></div></div></section></div>`;
  const drawThumbs = () => {
    $("thumbs").innerHTML = orderFiles.map((f, i) => `<div class="thumb"><img src="${f.data}" alt="${esc(f.name)}"><button type="button" data-i="${i}" aria-label="Xoá ảnh">✕</button></div>`).join("");
    document.querySelectorAll(".thumb button").forEach(b => b.onclick = () => { orderFiles.splice(+b.dataset.i, 1); drawThumbs(); });
  };
  const addFiles = async list => {
    const imgs = [...list].filter(f => f.type.startsWith("image/"));
    if (imgs.length < list.length) alert("Chỉ nhận file ảnh nhé.");
    for (const f of imgs) {
      if (orderFiles.length >= MAX_IMG) { alert(`Tối đa ${MAX_IMG} ảnh thôi nhé.`); break; }
      try { orderFiles.push({ name: f.name.replace(/\.[^.]+$/, "") + ".jpg", data: await fileToJpeg(f) }); }
      catch (e) { alert("Không đọc được ảnh: " + e.message); }
    }
    drawThumbs();
  };
  $("f_files").onchange = async e => { await addFiles(e.target.files); e.target.value = ""; };
  const dz = $("drop");
  ["dragenter", "dragover"].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.remove("over"); }));
  dz.addEventListener("drop", e => addFiles(e.dataTransfer.files));
  drawThumbs();

  $("submit").onclick = async () => {
    const name = $("f_name").value.trim(), contact = $("f_contact").value.trim();
    if (!name || !contact) return alert("Nhập tên và Zalo/SĐT của bạn nhé.");
    const code = "BV" + Math.random().toString(36).slice(2, 8).toUpperCase();
    const o = { code, name, contact, kind: $("f_kind").value, deadline: $("f_deadline").value, budget: $("f_budget").value.trim(),
                note: $("f_note").value.trim(), status: STATUSES[0], uid: user?.uid || null, email: user?.email || null };
    $("submit").disabled = true;
    try { if (fb && user) await fb.db.collection("orders").doc(code).set({ ...o, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); }
    catch (e) { console.error(e); }
    const imgs = orderFiles.map(f => ({ name: f.name, type: "image/jpeg", data: f.data.split(",")[1] }));
    await notify({ ...o, imageCount: imgs.length, images: imgs });
    $("done").innerHTML = `<div class="notice"><strong>Đã nhận đơn.</strong> Mã ticket của bạn: <span class="price">${code}</span><br>
      ${imgs.length ? (NOTIFY_URL ? `Đã gửi kèm ${imgs.length} ảnh đề bài.<br>` : `Ảnh đính kèm chưa gửi tự động được, bạn gửi ${imgs.length} ảnh đó qua Zalo nhé.<br>`) : ""}Gửi mã này kèm file đề (ảnh/PDF) cho mình qua Zalo để mình bắt đầu nhé.<br>
      <a class="btn mint" href="https://zalo.me/${esc(SITE.zalo)}" target="_blank" rel="noopener">Mở Zalo</a></div>`;
    orderFiles = []; $("thumbs").innerHTML = "";
    if (navigator.clipboard) navigator.clipboard.writeText(`Mã đơn ${code} - ${name} - ${o.kind}`).catch(() => {});
  };
}

function accountPage() {
  if (!fb) { app.innerHTML = head("Tài khoản") + `<div class="wrap"><section><div class="notice">Đăng nhập chưa được bật. Điền phần FIREBASE trong file index.html để dùng (xem hướng dẫn).</div></section></div>`; return; }
  if (!user) {
    app.innerHTML = head("Đăng nhập") + `<div class="wrap"><section><div class="card">
      <button class="btn mint" id="g">Đăng nhập bằng Google</button><hr>
      <label for="em">Email</label><input id="em" type="email"><label for="pw">Mật khẩu (từ 6 ký tự)</label><input id="pw" type="password">
      <p><button class="btn" id="li">Đăng nhập</button><button class="btn mint" id="su">Tạo tài khoản</button></p><div id="err" class="muted"></div></div></section></div>`;
    const fail = e => $("err").textContent = "Không thành công: " + e.message;
    $("g").onclick = () => fb.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(fail);
    $("li").onclick = () => fb.auth.signInWithEmailAndPassword($("em").value, $("pw").value).catch(fail);
    $("su").onclick = () => fb.auth.createUserWithEmailAndPassword($("em").value, $("pw").value).catch(fail);
    return;
  }
  app.innerHTML = head("Tài khoản") + `<div class="wrap"><section><div class="row"><p>Xin chào <strong>${esc(user.displayName || user.email)}</strong></p>
    <span>${isOwner() ? `<a class="btn small mint" href="#/admin">Quản lý đơn</a>` : ""}<button class="btn small" id="out">Đăng xuất</button></span></div>
    <h2>Đơn của bạn</h2><div id="mine">Đang tải...</div></section></div>`;
  $("out").onclick = () => fb.auth.signOut();
  fb.db.collection("orders").where("uid", "==", user.uid).get().then(s => {
    const l = s.docs.map(d => d.data()).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    $("mine").innerHTML = l.length ? l.map(o => `<div class="card row"><div><strong>${esc(o.code)}</strong> · ${esc(o.kind)}<div class="muted">Hạn ${esc(o.deadline || "chưa chọn")}</div></div><span class="tag">${esc(o.status)}</span></div>`).join("")
      : `<p class="muted">Bạn chưa có đơn nào. <a href="#/dat-don">Đặt vẽ ngay</a></p>`;
  }).catch(() => $("mine").textContent = "Không tải được đơn. Kiểm tra Firestore rules.");
}

function adminPage() {
  if (!isOwner()) { app.innerHTML = head("Quản lý đơn") + `<div class="wrap"><section><p>Chỉ chủ web mới xem được trang này.</p></section></div>`; return; }
  app.innerHTML = head("Quản lý đơn") + `<div class="wrap"><section><div class="scroll" id="all">Đang tải...</div></section></div>`;
  fb.db.collection("orders").get().then(s => {
    const l = s.docs.map(d => d.data()).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    $("all").innerHTML = `<table><tr><th>Mã</th><th>Khách</th><th>Yêu cầu</th><th>Trạng thái</th></tr>${l.map(o => `<tr><td>${esc(o.code)}</td>
      <td>${esc(o.name)}<br>${esc(o.contact)}</td><td>${esc(o.kind)}, hạn ${esc(o.deadline)}, ${esc(o.budget)}<br>${esc(o.note)}</td>
      <td><select data-c="${esc(o.code)}">${STATUSES.map(t => `<option ${t === o.status ? "selected" : ""}>${t}</option>`).join("")}</select></td></tr>`).join("")}</table>`;
    document.querySelectorAll("select[data-c]").forEach(sel => sel.onchange = () => fb.db.collection("orders").doc(sel.dataset.c).update({ status: sel.value }));
  });
}

/* ---------- Màn hình loading ---------- */
const loader = $("loader"), wait = ms => new Promise(r => setTimeout(r, ms));
$("ldPic").innerHTML = LOADER.image ? `<img src="${esc(LOADER.image)}" alt="">` : LOADER.emoji;
loader.style.setProperty("--fade-in", LOADER.fade + "ms");
let ldTimer, swapTimer;
function hideLoader() { loader.classList.remove("on"); }
// Chuyển trang: mờ dần vào loading -> (lúc đã phủ kín) đổi nội dung -> giữ chút -> mờ dần ra
function showLoader(swap) {
  clearTimeout(ldTimer); clearTimeout(swapTimer);
  loader.classList.add("on");
  swapTimer = setTimeout(swap, LOADER.fade);
  ldTimer = setTimeout(hideLoader, LOADER.fade + LOADER.page);
}
// Lần đầu / F5: đợi đủ thời gian tối thiểu và đợi trang tải xong (tối đa 4 giây)
const pageLoaded = new Promise(r => document.readyState === "complete" ? r() : window.addEventListener("load", r));
Promise.all([wait(LOADER.first), Promise.race([pageLoaded, wait(4000)])]).then(() => { if (!ldTimer) hideLoader(); });

/* ---------- Điều hướng ---------- */
const routes = { "": home, "tai-lieu": docsPage, "bang-gia": pricePage, "dat-don": orderPage, "tai-khoan": accountPage, "admin": adminPage };
function route(keepScroll) {
  const p = decodeURIComponent(location.hash.slice(2)).split("/");
  (routes[p[0]] || home)(p[1]);
  document.querySelectorAll("nav [data-r]").forEach(a => a.classList.toggle("on", a.dataset.r === p[0]));
  if (!keepScroll) window.scrollTo({ top: 0, behavior: "instant" });
  navState();
}
function navState() {
  const atHome = !(location.hash.slice(2)) ;
  $("nav").classList.toggle("solid", !atHome || window.scrollY > 60);
}
window.addEventListener("hashchange", () => showLoader(() => route()));
window.addEventListener("scroll", navState, { passive: true });
route(); initFirebase();
</script>
